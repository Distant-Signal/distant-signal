name: Dependency vulnerability scan

# Independent supply-chain vulnerability scan for Cargo.lock
# (workspace-wide), frontend/package-lock.json and uv.lock (the scripts'
# lint tools), distinct from what Renovate already does
# (osvVulnerabilityAlerts/vulnerabilityAlerts only open a version-bump PR
# when Renovate itself already knows to touch a dependency; see
# docs/specs/dependency-security-scanning-investigation.md in the
# Ranma-Config repo for the cross-repo rationale). Distant-Signal/ci's
# reusable dependency-scan.yml does the work; its header comment explains
# the pinned OSV-Scanner binary, the CVSS thresholds and the
# block-vs-alert rules:
#
# - pull_request (branches: [main, dev], matching ci.yml's own branch set)
#   and push (branches: [main]): fails only on a CRITICAL (CVSS >= 9.0)
#   finding with a fix available, or an inconclusive scan; every other
#   HIGH/CRITICAL finding is a warning annotation plus the neutral
#   "security findings (non-blocking)" check run.
# - schedule (daily): the same scan against main, never failing on
#   findings; its report-findings job opens, updates or closes the single
#   tracking issue labelled `dependency-vulnerability`.

concurrency:
  group: dependency-scan-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main]
  schedule:
    # Daily: newly disclosed CVEs in already-merged dependencies are this
    # trigger's reason to exist, and a same-day catch beats a week's
    # exposure. 05:23 UTC is an arbitrary off-peak slot, off the hour.
    - cron: "23 5 * * *"

# INF-14: read-only by default. The reusable workflow's jobs each ask for
# only what they need: the scan job checks: write (its neutral check run),
# the schedule-only report-findings job issues: write, so pull request and
# push runs never hold issues: write.
permissions:
  contents: read

jobs:
  dependency-scan:
    uses: Distant-Signal/ci/.github/workflows/dependency-scan.yml@eb5552be3a85b5aa333879202b50941f5af878be # main
    permissions:
      contents: read
      checks: write
      issues: write
