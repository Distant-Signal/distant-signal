name: CI

# Lint, build and test the frontend. The Rust services live in their own
# repositories since the repo split (the api in Distant-Signal/ds-api), and
# the Helm chart and its checks are Distant-Signal/ds-deploy's.
#
# Runs on every pull request targeting main/dev, and on every push to
# main/master/dev. This is a superset of the "push validation" bullet in
# the CI design doc: pushes and PRs run the same job set, there is no
# reduced subset, because none of these jobs are slow/expensive enough to
# warrant skipping on push (the container build/publish pipeline, which IS
# expensive, lives in containers.yml instead).
#
# Most jobs call Distant-Signal/ci's reusable workflows (repo split spec
# §5.5 and §8.3), pinned by SHA; Renovate bumps the pins. Each of their
# checks shows as `<job> / <job inside the reusable workflow>`. What stays
# here is Distant Signal's own: the Playwright e2e job and the repository
# checks. `actionlint` calls
# FasterSpeeding/Piped's reusable lint-actions.yml.

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches: [main, dev]
  push:
    branches: [main, master, dev]

permissions:
  contents: read

jobs:
  # Reusable workflow_call from FasterSpeeding/Piped: runs actionlint over
  # this repo's own .github/workflows/*.yml via reviewdog. Self-contained
  # (checkout + one third-party action), no justfile dependency -- a clean
  # fit for validating the workflow files this change adds.
  actionlint:
    uses: FasterSpeeding/Piped/.github/workflows/lint-actions.yml@5bbddb5d32d5bde939b18f6c6bcfa0e36779412f # master @ 2026-09-01

  # Distant-Signal/ci's node-ci.yml on frontend/: npm ci, ESLint (flat
  # config on eslint-config-next), the copy guardrails, the npm licence gate
  # (every production dependency AGPL-compatible, repo split spec §6),
  # Prettier (all but frontend/.prettierignore), `tsc --noEmit` (ESLint's
  # typescript-eslint rules are lint, not a type-check), the plain-JS files
  # tsconfig.json leaves out (`typecheck:scripts`: the service worker and
  # the Node-run scripts and configs, checkJs + strict), vitest and
  # `next build`.
  #
  # Vitest is NOT run here (`skip-test: true`), though the check keeps the
  # reusable job's name, `frontend / npm lint, licences, prettier, tsc, test,
  # build`, so it stays stable. The tests run in the `vitest` shard jobs
  # below, in parallel with this one; `vitest (gate)` is the check that
  # fails when any shard does.
  #
  # The copy guardrails are docs/style-guide.md's Writing rules: banned
  # phrases, Title Case h1/h2, meta descriptions over 160 characters and
  # pages without metadata. scripts/check-copy.py is stdlib-only; it runs
  # frontend/scripts/extract-copy.mjs, which needs node_modules, so it runs
  # here rather than in scripts-lint (which lints and unit-tests it).
  #
  # The Playwright e2e tests need a live api, Postgres and Redis: see
  # frontend-e2e.
  frontend:
    uses: Distant-Signal/ci/.github/workflows/node-ci.yml@8610585cf6437277e07cfcf98d9ee900f2a9565f # main
    with:
      working-directory: frontend
      repo-check-name: Copy guardrails (scripts/check-copy.py)
      repo-check-command: uv run --locked --no-default-groups scripts/check-copy.py
      extra-npm-scripts: typecheck:scripts
      skip-test: true

  # vitest, split into three shards (`--shard=i/N`: whole test files, split
  # by Vitest's own file ordering) that run in parallel, one job apiece. The
  # setup is node-ci.yml's (Node 22, the npm cache keyed on the lockfile,
  # `npm ci`), so each shard installs from the cache. Change the shard count
  # in the matrix and in the `--shard` argument together.
  vitest:
    name: vitest shard ${{ matrix.shard }}/3
    runs-on: ubuntu-26.04
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install Node.js
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: npm ci
        run: npm ci --prefer-offline --no-audit --no-fund

      - name: vitest (shard ${{ matrix.shard }}/3)
        run: npx vitest run --shard=${{ matrix.shard }}/3

  # The gate: green only when every shard succeeded. `always()` so a failed
  # or cancelled shard fails the gate instead of skipping it.
  vitest-gate:
    name: vitest (gate)
    if: always()
    needs: vitest
    runs-on: ubuntu-26.04
    steps:
      - name: Every shard succeeded
        env:
          RESULT: ${{ needs.vitest.result }}
        run: |
          echo "vitest: ${RESULT}"
          [[ "${RESULT}" == "success" ]]

  # Custom: Playwright e2e + full-default-ruleset axe-core accessibility
  # sweep (frontend/e2e/, 7 spec files -- accessibility.spec.ts is the axe
  # sweep, the rest cover nav/layout/chat/connectivity/service-worker/push
  # notifications). This is the job the `frontend` job's own comment used to
  # say was deliberately deferred until e2e specs existed; they now do.
  #
  # Needs a real, reachable `api` (Postgres + Redis behind it) to render
  # anything beyond a skeleton/error state: the api image
  # frontend/api-image.txt pins, with Postgres and Redis as `services:`
  # rather than `docker-compose.yml`, which needs dummy values for ~20+
  # unrelated service credentials just to resolve config.
  #
  # The `INTERNAL_OAUTH_*`/`SSO_*` values in e2e.yml are dummy-but-syntactically-
  # valid, matching local dev's own `.devdata/api.env` pattern: `api` only
  # syntax-checks an issuer URL at startup (OIDC discovery is lazy -- see
  # ds-api's `crates/api/src/data/config.rs` doc comments on `sso_issuer_url`),
  # never actually contacting it unless a real OAuth redirect happens,
  # which no spec here drives.
  #
  # It runs three ways (DS-534), each its own stack in the reusable
  # .github/workflows/e2e.yml: the suite as the chart runs the api (numeric
  # ids served); the same suite against an api started with
  # API_SERVE_NUMERIC_IDS=false, which serves every numeric id that has an
  # opaque sibling as 0, so a page or spec that reads a numeric id as a value
  # (a key, a join, a path, an ordering) fails there; and the visual
  # screenshots, in the pinned Playwright container. The suite runs are each
  # split into three Playwright shards (`--shard=i/N`), one job and one
  # seeded stack apiece, so the wall time is one shard's. The visual project
  # is a single file on a single worker, so it is its own job rather than a
  # shard. "Playwright e2e + accessibility" and "Playwright e2e with numeric
  # ids off (DS-534)" stay the check names: each is a gate job that needs its
  # shards and fails when any of them did not succeed. The numeric-ids-off
  # one is not a required check.
  #
  # Did this change touch frontend/? The visual job runs only when it did.
  # Answers "changed" whenever it can't tell (a new branch's first push, an
  # unfetchable base), so the check is never skipped wrongly.
  frontend-paths:
    name: Did this change touch frontend/?
    runs-on: ubuntu-26.04
    outputs:
      changed: ${{ steps.frontend-paths.outputs.changed }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Did this change touch frontend/?
        id: frontend-paths
        uses: Distant-Signal/ci/actions/paths-changed@d734bc69e3127d208304c9d6a5a04b9e5645fc76 # main
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          paths: frontend/

  # The shards of the suite as the chart runs the api. The first shard saves
  # the Playwright browsers and Next.js build caches on main.
  e2e-default:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    uses: ./.github/workflows/e2e.yml
    with:
      mode: tests
      label: default-${{ matrix.shard }}
      shard: ${{ matrix.shard }}
      shard-total: 3
      save-caches: ${{ matrix.shard == 1 }}

  # The shards of the suite against an api that serves numeric ids as 0.
  e2e-numeric-ids-off:
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3]
    uses: ./.github/workflows/e2e.yml
    with:
      mode: tests
      label: numeric-ids-off-${{ matrix.shard }}
      numeric-ids-off: true
      shard: ${{ matrix.shard }}
      shard-total: 3

  e2e-visual:
    needs: frontend-paths
    if: needs.frontend-paths.outputs.changed == 'true'
    uses: ./.github/workflows/e2e.yml
    with:
      mode: visual
      label: visual

  # The gates: the checks' original names, green only when every job they
  # need succeeded (the visual job may be skipped: nothing under frontend/
  # changed). `always()` so a failed or cancelled shard fails the gate
  # instead of skipping it.
  frontend-e2e:
    name: Playwright e2e + accessibility
    if: always()
    needs: [e2e-default, e2e-visual]
    runs-on: ubuntu-26.04
    steps:
      - name: Every shard succeeded
        env:
          DEFAULT: ${{ needs.e2e-default.result }}
          VISUAL: ${{ needs.e2e-visual.result }}
        run: |
          echo "e2e-default: ${DEFAULT}"
          echo "e2e-visual: ${VISUAL}"
          [[ "${DEFAULT}" == "success" ]] && [[ "${VISUAL}" == "success" || "${VISUAL}" == "skipped" ]]

  frontend-e2e-numeric-ids-off:
    name: Playwright e2e with numeric ids off (DS-534)
    if: always()
    needs: e2e-numeric-ids-off
    runs-on: ubuntu-26.04
    steps:
      - name: Every shard succeeded
        env:
          RESULT: ${{ needs.e2e-numeric-ids-off.result }}
        run: |
          echo "e2e-numeric-ids-off: ${RESULT}"
          [[ "${RESULT}" == "success" ]]

  # DS-534: frontend/e2e/fixtures/seed.sql seeds the missed-train fixtures
  # relative to the clock, and a seeding hour that put them on the wrong
  # London service date failed journey-missed-train.spec.ts only at some
  # hours. scripts/check-e2e-seed-clock.py runs the seed at thirteen clocks (UTC
  # and BST, 19:10 to 03:30 London) in databases cloned from a migrated
  # template and applies the api's missed-train rules to each. It needs only
  # Postgres and the migrations, so it runs on every PR and push rather than
  # behind a path filter: the clone-and-seed loop is seconds. The database is
  # migrated as frontend-e2e does (ds-migrate at the pinned api's
  # core-version). Its unit tests run in scripts-lint.
  e2e-seed-clock:
    name: e2e seed clock check (DS-534)
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    # The same Postgres image and health-check options as frontend-e2e.
    services:
      postgres:
        image: postgres:18@sha256:edb0c08dc33befd0262ab3b5cf1c4f3f8cfd8b09e88c05b45adee29d6761ddb6
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      # libpq's environment, which the script's psql calls read.
      PGHOST: localhost
      PGPORT: "5432"
      PGUSER: postgres
      PGPASSWORD: postgres
      PGDATABASE: postgres

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Only the image's core-version label is wanted, as in frontend-e2e.
      - name: Read the pinned api image's core-version
        id: api
        run: |
          set -euo pipefail
          ref="$(grep -v '^[[:space:]]*#' frontend/api-image.txt | grep -v '^[[:space:]]*$')"
          docker pull --quiet "${ref}"
          core="$(docker inspect --format '{{ index .Config.Labels "org.distant-signal.core-version" }}' "${ref}")"
          [[ "${core}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "the api image has no core-version label"; exit 1; }
          echo "core=${core}" >> "${GITHUB_OUTPUT}"

      - name: Migrate a template database (ds-migrate at the api's core-version)
        env:
          CORE: ${{ steps.api.outputs.core }}
        run: |
          set -euo pipefail
          psql -v ON_ERROR_STOP=1 -c 'CREATE DATABASE ds_tpl'
          docker run --rm --network host \
            -e MIGRATION_DATABASE_URL="postgres://postgres:postgres@localhost:5432/ds_tpl" \
            "ghcr.io/distant-signal/images/ds-migrate:${CORE}" run

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.6"
          # Nothing to cache: no dependencies are installed.
          enable-cache: false

      - name: Seed the e2e fixtures at each clock and check the missed-train rules
        run: uv run --locked --no-default-groups scripts/check-e2e-seed-clock.py --template ds_tpl

  # Commit identity (repo split spec §5.10), Distant-Signal/ci's
  # identity.yml: no commit in the PR or push may use a retired
  # author/committer address or carry AI attribution (a Co-authored-by
  # trailer with an @anthropic.com address, a Claude-Session trailer, a
  # "Generated with Claude Code" footer). Other identities pass, outside
  # contributors included.
  commit-identity:
    uses: Distant-Signal/ci/.github/workflows/identity.yml@d734bc69e3127d208304c9d6a5a04b9e5645fc76 # main

  # Every LICENSE in the repository is the canonical GNU AGPL
  # v3 text, byte for byte: the licence text is never distributed modified.
  # Distant-Signal/ci's licence.yml compares against a pinned SHA-256.
  licence:
    uses: Distant-Signal/ci/.github/workflows/licence.yml@d734bc69e3127d208304c9d6a5a04b9e5645fc76 # main

  # Distant-Signal/ci's scripts-lint.yml, strict by default:
  #   - every tracked *.sh: shellcheck with every optional check at style
  #     severity (.shellcheckrc) and shfmt (style from .editorconfig);
  #   - scripts/*.py: ruff check (select ALL), ruff format --check and mypy
  #     --strict (pyproject.toml);
  #   - the workflow run: blocks: actionlint with SHELLCHECK_OPTS
  #     '--enable=all --severity=style' (the `actionlint` job above uses
  #     Piped's reviewdog wrapper, which runs shellcheck with its default
  #     checks only);
  #   - every tracked Dockerfile: hadolint, every rule, failing down to
  #     style level, trusted registry docker.io only (.hadolint.yaml);
  #   - lint-containers.py: shellcheck, as for *.sh, over every Dockerfile
  #     RUN body and the docker-compose*.yml inline shell, and every image a
  #     Dockerfile or compose file pulls pinned by @sha256 digest;
  # then scripts/tests (stdlib unittest). Every tool is pinned in pyproject.toml's `lint` dependency
  # group and, with the rest of the tree and its hashes, in uv.lock. Locally,
  # from the repository root, with a checkout of Distant-Signal/ci:
  #   uv run python <ci>/scripts/lint-scripts.py
  scripts-lint:
    uses: Distant-Signal/ci/.github/workflows/scripts-lint.yml@d734bc69e3127d208304c9d6a5a04b9e5645fc76 # main

  # Distant Signal's own repository checks, run with the pinned script
  # tools (pyproject.toml's `lint` group): the vendored ds-core site
  # credits, the api types and OpenAPI copy against the pinned api image,
  # and the dev SFTP entrypoint copy. The chart's checks moved to
  # Distant-Signal/ds-deploy with the chart (repo split spec §8.3, phase 5).
  repo-checks:
    name: repo checks (ds-core files, api types, SFTP entrypoint)
    runs-on: ubuntu-26.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up uv
        uses: astral-sh/setup-uv@07a047e608db84b3d8c06cd9a7c7dcc9c355c18e # v10.3.2
        with:
          # renovate: datasource=pypi depName=uv
          version: "0.13.6"
          # Caches uv's download/wheel cache, keyed on uv.lock.
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Install the pinned script tools
        run: uv sync --locked --group lint

      # frontend/lib/site-credits.json is the line catalogue validator's
      # site credits, a release asset of the ds-core release `core-version`
      # pins (repo split spec §5.1), verified against its Sigstore bundle
      # from ds-core's release.yml at the tag. Fails when the copy differs
      # from the release. (ds-deploy vendors the chart's six access assets.)
      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: ds-core's site credits and pins match core-version
        run: uv run --no-sync scripts/sync-core.py --check

      # docker/schedule-sftp-entrypoint.sh, the dev stack's sftpgo script,
      # is a copy of the one Distant-Signal/ds-deploy's chart embeds, at the
      # ds-deploy commit docker/schedule-sftp-entrypoint.ds-deploy pins
      # (Renovate moves the pin): fail when the two differ.
      - name: dev SFTP entrypoint matches ds-deploy's pinned chart copy
        run: uv run --no-sync scripts/check-sftp-entrypoint.py

      # frontend/lib/api-types.ts and openapi-v1.json are copies of the
      # api's generated api-types/api.ts and openapi/v1.json (repo split spec
      # §5.3), read from the api image frontend/api-image.txt pins and
      # verified byte for byte against its digests. Distant-Signal/ds-api's
      # `cargo test` checks those files against the Rust types.
      - name: frontend's api types and OpenAPI copy match the pinned api image
        run: uv run --no-sync scripts/sync-api-types.py check

      # The frontend's copy of the personal-token API's OpenAPI document
      # (ds-api's docs/specs/personal-api-tokens.md §12): fails on a breaking
      # change since the base (oasdiff, pinned in Distant-Signal/ci), so a pin
      # bump that brings one fails here as well as in Distant-Signal/ds-api.
      # A breaking change needs a /v2 document instead.
      - name: no breaking change to the personal-token OpenAPI document
        uses: Distant-Signal/ci/actions/openapi-breaking@d734bc69e3127d208304c9d6a5a04b9e5645fc76 # main
        with:
          base: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          specs: frontend/lib/openapi-v1.json

